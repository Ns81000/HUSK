name = "husk"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Frontend origins allowed to call this Worker. Add your Lovable preview domain
# and any custom domain, comma separated, no trailing slash.
[vars]
ALLOWED_ORIGINS = "http://localhost:8080"

[[durable_objects.bindings]]
name = "HUSK_ROOMS"
class_name = "HuskRoom"

# Join rate-limit counters live in a single HuskGatekeeper instance instead of
# KV, so deployment needs no manually created namespace.
[[durable_objects.bindings]]
name = "HUSK_GATE"
class_name = "HuskGatekeeper"

# Both classes use the SQLite storage backend — the only Durable Object backend
# available on the Workers Free plan. File chunks are stored as 1 MiB rows in
# the room's own storage and die with the room's alarm purge.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["HuskRoom", "HuskGatekeeper"]

# Set with: wrangler secret put HUSK_TICKET_SECRET
# (a long random string; used only to sign short-lived file transfer tickets)
