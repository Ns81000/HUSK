name = "husk"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Frontend origins allowed to call this Worker. Comma separated, no trailing
# slash. 3000 is the dev server port (8080 sits in a Windows-reserved port
# range); the workers.dev entry is the deployed frontend.
[vars]
ALLOWED_ORIGINS = "http://localhost:8080,http://localhost:3000,https://ns81000-husk.ns8pc1.workers.dev"

[[durable_objects.bindings]]
name = "HUSK_ROOMS"
class_name = "HuskRoom"

# Join rate-limit counters live in a single HuskGatekeeper instance instead of
# KV, so deployment needs no manually created namespace.
[[durable_objects.bindings]]
name = "HUSK_GATE"
class_name = "HuskGatekeeper"

# Both classes use the SQLite storage backend — the only Durable Object backend
# available on the Workers Free plan. File chunks are stored as 1 MiB rows in
# the room's own storage and die with the room's alarm purge.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["HuskRoom", "HuskGatekeeper"]

# Set with: wrangler secret put HUSK_TICKET_SECRET
# (a long random string; used only to sign short-lived file transfer tickets)
#
# NOTE: do NOT add a [limits] cpu_ms block here — the Free plan API rejects
# declaring CPU limits entirely (error 100328). The Free plan already applies
# its 10 ms default; local workerd doesn't meter CPU, so the integration
# suite's CPU evidence is the streamed round-trip itself (see phase-6-log.md).
