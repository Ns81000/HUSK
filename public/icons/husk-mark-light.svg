<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 96" width="256" height="256">
  <title>Husk mark — light surfaces</title>
  <defs>
    <linearGradient id="greenTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb37f"/>
      <stop offset="100%" stop-color="#1f8f5c"/>
    </linearGradient>
    <linearGradient id="greenLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c8a58"/>
      <stop offset="100%" stop-color="#146b43"/>
    </linearGradient>
    <linearGradient id="greenRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12603a"/>
      <stop offset="100%" stop-color="#0a3f26"/>
    </linearGradient>
  </defs>
  <!-- top face -->
  <polygon points="42,8 76,28 42,48 8,28" fill="url(#greenTop)"/>
  <!-- left face -->
  <polygon points="8,28 42,48 42,88 8,68" fill="url(#greenLeft)"/>
  <!-- right face -->
  <polygon points="76,28 76,68 42,88 42,48" fill="url(#greenRight)"/>
  <!-- top edge highlight -->
  <polyline points="8,28 42,8 76,28" fill="none" stroke="#8de8b8" stroke-width="1.5" opacity="0.6"/>
  <!-- bottom edge shadow line -->
  <polyline points="8,68 42,88 76,68" fill="none" stroke="#06251770" stroke-width="1.5"/>
</svg>
